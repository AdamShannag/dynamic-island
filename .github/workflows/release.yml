name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test
        run: |
          go test -race -count=1 ./...
          (cd extension && npm ci && npm run check && npm test)
      - name: version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
      - name: build tarball and .deb packages
        run: |
          make dist deb VERSION=${{ steps.version.outputs.version }} NFPM="$(go env GOPATH)/bin/nfpm"
          (cd dist && sha256sum ./*.deb ./*.tar.gz > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.deb dist/*.tar.gz dist/SHA256SUMS --title "Dynamic Island $TAG" --generate-notes
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb

  apt:
    name: Publish APT repository
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: debs
      - name: check signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: test -n "$KEY" || { echo "::error::Add the APT_GPG_PRIVATE_KEY secret (see CLAUDE.md, Releasing)"; exit 1; }
      - name: import signing key
        id: gpg
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$KEY" | gpg --batch --import
          echo "id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_OUTPUT"
      - name: check out gh-pages
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show-ref --quiet refs/heads/gh-pages; then
            git worktree add repo gh-pages
          else
            git worktree add --detach repo
            git -C repo checkout --orphan gh-pages
            git -C repo rm -rfq .
          fi
      - name: build repository
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.id }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          sudo apt-get install -y --no-install-recommends apt-utils
          BASE_URL="https://${OWNER,,}.github.io/${REPO_NAME}" packaging/apt-repo.sh repo debs/*.deb
      - name: push
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish $TAG" || { echo "nothing to publish"; exit 0; }
          git push origin gh-pages
